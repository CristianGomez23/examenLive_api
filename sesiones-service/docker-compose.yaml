name: examenlive-microservicios
services:
  sesiones-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sesiones
      POSTGRES_USER: sesiones
      POSTGRES_PASSWORD: sesiones
    ports: ["5543:5432"]
    volumes: ["sesiones_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesiones -d sesiones"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  sesiones_data:
