name: examenlive-microservicios
services:
  resultados-db:
    image: postgres:16
    environment:
      POSTGRES_DB: resultados
      POSTGRES_USER: resultados
      POSTGRES_PASSWORD: resultados
    ports: ["5544:5432"]
    volumes: ["resultados_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resultados -d resultados"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  resultados_data:
