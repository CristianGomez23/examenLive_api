spring:
  application:
    name: examenLive_api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examenlive}
    username: examenlive
    password: examenlive
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    # Permite aplicar V2.5 en bases que ya tenían V3 aplicada (migración idempotente).
    out-of-order: true
